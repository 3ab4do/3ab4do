name: generate animation

on:
  # تشغيل الأداة تلقائياً كل ساعات محددة أو يدوياً
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. سحب محتوى المستودع
      - name: Checkout
        uses: actions/checkout@v3

      # 2. توليد ملفات الـ GIF و SVG للثعبان
      - name: Generate contribution grid snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1ff,#4b91ff

      # 3. رفع الملفات الناتجة إلى فرع (Branch) منفصل يسمى output
      - name: Push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
